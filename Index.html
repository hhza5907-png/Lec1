<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي البسيطة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بالعالم! 👋</h1>
        <p>هذه صفحة HTML بسيطة. يمكنك تعديلها وإضافة المحتوى الذي تريده.</p>
        <p>الوقت الحالي: <span id="time"></span></p>
        <button onclick="showTime()">اضغط هنا لعرض الوقت</button>
    </div>

    <script>
        function showTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('ar-SA');
        }
    </script>
</body>
      </html>
